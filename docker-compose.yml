services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      # containers use kafka:9092, host tools use localhost:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # topics are created only by kafka-init (3 partitions); a client must never create one with the default of 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    # --if-not-exists keeps a topic that already exists, even a wrong one, so each topic is described afterwards
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic quotes --partitions 3
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic emotions --partitions 3 --config retention.ms=-1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic quotes | grep -q -E "PartitionCount: 3[^0-9]" || { echo "ERROR: topic quotes must have 3 partitions (delete it and run kafka-init again)" >&2; exit 1; }
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic emotions | grep -q -E "PartitionCount: 3[^0-9]" || { echo "ERROR: topic emotions must have 3 partitions (delete it and run kafka-init again)" >&2; exit 1; }
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic emotions | grep -q "retention.ms=-1" || { echo "ERROR: topic emotions must have retention.ms=-1 (delete it and run kafka-init again)" >&2; exit 1; }

  ollama:
    image: ollama/ollama:0.35.1
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollamadata:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 20

  ollama-init:
    image: ollama/ollama:0.35.1
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    # download the model, then load it once so the slow first load happens here
    entrypoint: ["sh", "-c", "ollama pull ${OLLAMA_MODEL:-qwen2.5:3b} && ollama run ${OLLAMA_MODEL:-qwen2.5:3b} ok"]

  app:
    build: .
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully
    # DB_URL, DB_USER and DB_PASSWORD come from the git-ignored .env, only as environment of this container
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OLLAMA_URL: http://ollama:11434
      JAVA_TOOL_OPTIONS: -Xmx384m
    volumes:
      - ./data:/app/data:ro
    ports:
      - "8080:8080"
    mem_limit: 640m

volumes:
  kafkadata:
  ollamadata:
