<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kafka-on-Kafka</title>
  <style>
    :root {
      --bg: #fafafa; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea; --bar: #5b6ee1;
      --live: #1a9e55; --wait: #c47f00; --down: #d0342c;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121214; --card: #1c1c1f; --text: #f2f2f4; --muted: #9a9aa2; --line: #2c2c31; --bar: #7b8cff; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
    header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    h1 { font-size: 1.4rem; margin: 0; }
    h2 { font-size: 1rem; margin: 28px 0 8px; color: var(--muted); font-weight: 600; }
    #status { font-size: .85rem; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor; }
    #status.live { color: var(--live); } #status.wait { color: var(--wait); } #status.down { color: var(--down); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
    .row { display: grid; grid-template-columns: 110px 1fr 70px; align-items: center; gap: 10px; padding: 4px 0; }
    .bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
    .bar > span { display: block; height: 100%; background: var(--bar); width: 0; transition: width .3s; }
    .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; }
    li { padding: 10px 0; border-bottom: 1px solid var(--line); }
    li:last-child { border-bottom: 0; }
    .meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); margin-bottom: 2px; }
    .tag { font-weight: 600; color: var(--text); }
    .text { overflow-wrap: anywhere; }
    .empty { color: var(--muted); }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Kafka-on-Kafka <span style="color: var(--muted); font-weight: 400;">· The Metamorphosis</span></h1>
    <span id="status" class="wait">connecting…</span>
  </header>

  <h2>Quotes classified: <span id="total">0</span></h2>
  <div class="card" id="counts"></div>

  <h2>Latest</h2>
  <div class="card"><ul id="latest"><li class="empty">Nothing yet.</li></ul></div>
</main>

<script>
  const EMOTIONS = ["anxiety", "absurdity", "resignation", "alienation", "bureaucracy", "despair", "confusion", "unknown"];
  const LATEST = 20;

  // The state shown on the page. It is rebuilt from /stats on every (re)connection.
  let state = null;       // { seq, total, counts, latest } once a snapshot is loaded
  let pending = [];       // events that arrived before the snapshot
  let version = 0;        // makes a late answer of an older load harmless

  const el = (id) => document.getElementById(id);
  const setStatus = (kind, text) => { const s = el("status"); s.className = kind; s.textContent = text; };

  function applyEvent(event) {
    if (!state || event.id <= state.seq) return;          // already inside the snapshot
    state.seq = event.id;
    state.total += 1;
    state.counts[event.result.emotion] = (state.counts[event.result.emotion] || 0) + 1;
    state.latest.unshift(event.result);
    if (state.latest.length > LATEST) state.latest.pop();
    render();
  }

  async function load() {
    const mine = ++version;
    state = null;
    pending = [];
    const response = await fetch("/stats");
    const snapshot = await response.json();
    if (mine !== version) return;                         // a newer load took over
    state = snapshot;
    const buffered = pending;
    pending = [];
    buffered.forEach(applyEvent);
    render();
  }

  function render() {
    if (!state) return;
    el("total").textContent = state.total;
    const max = Math.max(1, ...EMOTIONS.map((e) => state.counts[e] || 0));
    const rows = EMOTIONS.map((emotion) => {
      const count = state.counts[emotion] || 0;
      const row = document.createElement("div");
      row.className = "row";
      const name = document.createElement("span");
      name.textContent = emotion;
      const bar = document.createElement("div");
      bar.className = "bar";
      const fill = document.createElement("span");
      fill.style.width = (count * 100 / max) + "%";
      bar.appendChild(fill);
      const num = document.createElement("span");
      num.className = "num";
      num.textContent = count;
      row.append(name, bar, num);
      return row;
    });
    el("counts").replaceChildren(...rows);

    const items = state.latest.map((result) => {
      const li = document.createElement("li");
      const meta = document.createElement("div");
      meta.className = "meta";
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = result.emotion;
      const where = document.createElement("span");
      where.textContent = result.quoteId + (result.part ? " · part " + result.part : "");
      const when = document.createElement("span");
      when.textContent = new Date(result.classifiedAt).toLocaleTimeString();
      meta.append(tag, where, when);
      const text = document.createElement("div");
      text.className = "text";
      text.textContent = result.text.length > 220 ? result.text.slice(0, 220) + "…" : result.text;
      li.append(meta, text);
      return li;
    });
    if (items.length === 0) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "Nothing yet.";
      items.push(li);
    }
    el("latest").replaceChildren(...items);
  }

  // Open the stream first, then load the snapshot: events that arrive in between are kept and applied afterwards.
  const stream = new EventSource("/events");
  stream.onopen = () => {
    setStatus("live", "live");
    load().catch(() => setStatus("down", "cannot load the state"));
  };
  stream.onerror = () => setStatus("wait", "reconnecting…");
  stream.onmessage = (message) => {
    const event = { id: Number(message.lastEventId), result: JSON.parse(message.data) };
    if (state) applyEvent(event); else pending.push(event);
  };
</script>
</body>
</html>
